<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Guest WiFi Management</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f3f5f9;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.login-card{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:38px 32px;box-shadow:0 18px 50px rgba(0,0,0,.10)}.logo{width:58px;height:58px;margin:0 auto 20px;border-radius:16px;background:#006fff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:700}h1{margin:0;text-align:center;font-size:25px}.subtitle{text-align:center;margin:8px 0 30px;color:#777;line-height:1.5}label{display:block;margin:17px 0 8px;font-weight:600}input{width:100%;height:50px;padding:0 14px;border:1px solid #d8dce5;border-radius:10px;outline:none;font-size:16px}input:focus{border-color:#006fff}button{width:100%;height:52px;margin-top:26px;border:0;border-radius:10px;background:#006fff;color:#fff;font-size:16px;font-weight:600;cursor:pointer}.error{margin-bottom:18px;padding:12px 14px;border-radius:10px;background:#fff0f0;color:#b42318;font-size:14px}</style>
</head>
<body><div class="login-card"><div class="logo">WiFi</div><h1>Guest WiFi Management</h1><div class="subtitle">Sign in to manage guest network access.</div>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><label for="username">Username</label><input id="username" type="text" name="username" autocomplete="username" required autofocus><label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" required><button type="submit">Sign In</button></form></div></body>
</html>
