<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#10082b">
    <title>WiFi Access Error</title>
    <link rel="stylesheet" href="/static/portal/portal.css">
</head>
<body>
    <main class="portal-shell portal-shell--status">
        <div class="portal-layout">
            <section class="portal-visual" aria-label="Event welcome">
                <div class="brand-lockup">
                    <img class="brand-logo"
                         src="/static/portal/logo.svg"
                         alt="Event logo"
                         onerror="this.hidden=true;this.nextElementSibling.hidden=false">
                    <span class="brand-fallback" hidden>EVENT</span>
                </div>
            </section>

            <section class="portal-panel" aria-label="Connection error">
                <div class="portal-card status-card">
                    <div class="status-icon status-icon--error" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 7.5v5.8m0 3.2v.01"/>
                        </svg>
                    </div>

                    <p class="eyebrow">Guest network</p>
                    <h1>Unable to Connect</h1>
                    <p class="status-copy">{{ message }}</p>

                    <button class="secondary-button"
                            type="button"
                            onclick="window.history.back()">
                        Try Again
                    </button>
                    <p class="status-hint">If the problem continues, reconnect to WiFi.</p>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
