<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin Sign In</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    overflow: hidden;
    color: #f8f7ff;
    background:
        radial-gradient(
            circle at 18% 20%,
            rgba(146, 92, 255, .35),
            transparent 36%
        ),
        radial-gradient(
            circle at 82% 78%,
            rgba(221, 91, 173, .22),
            transparent 38%
        ),
        linear-gradient(135deg, #12072d, #060216 72%);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );
    background-size: 44px 44px;
    mask-image: linear-gradient(
        to bottom,
        rgba(0,0,0,.8),
        transparent
    );
}

.login-card {
    position: relative;
    width: 100%;
    max-width: 430px;
    padding: 38px 36px 34px;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 26px;
    background: rgba(18, 9, 43, .72);
    box-shadow:
        0 28px 80px rgba(0,0,0,.42),
        inset 0 1px rgba(255,255,255,.06);
    backdrop-filter: blur(22px);
}

.brand {
    display: flex;
    align-items: center;
    gap: 13px;
    margin-bottom: 30px;
}

.brand-mark {
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    border-radius: 14px;
    color: #fff;
    font-size: 20px;
    font-weight: 800;
    background: linear-gradient(
        135deg,
        #8d5cf6,
        #d65cae
    );
    box-shadow: 0 10px 30px rgba(157,83,227,.32);
}

.brand-name {
    font-size: 15px;
    font-weight: 750;
    letter-spacing: .14em;
    text-transform: uppercase;
}

.brand-note {
    margin-top: 4px;
    color: #aaa1c0;
    font-size: 12px;
}

h1 {
    margin: 0;
    font-size: 31px;
    letter-spacing: -.025em;
}

.subtitle {
    margin: 10px 0 27px;
    color: #aaa1c0;
    line-height: 1.55;
}

.error {
    margin-bottom: 20px;
    padding: 12px 14px;
    border: 1px solid rgba(255,116,137,.35);
    border-radius: 12px;
    color: #ffdce2;
    background: rgba(169,39,65,.2);
    font-size: 14px;
}

label {
    display: block;
    margin: 17px 0 8px;
    color: #ddd8eb;
    font-size: 14px;
    font-weight: 650;
}

input {
    width: 100%;
    height: 52px;
    padding: 0 15px;
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 13px;
    outline: none;
    color: #fff;
    background: rgba(255,255,255,.07);
    font-size: 16px;
    transition: border-color .2s, box-shadow .2s;
}

input:focus {
    border-color: #a679ff;
    box-shadow: 0 0 0 4px rgba(166,121,255,.12);
}

button {
    width: 100%;
    height: 53px;
    margin-top: 27px;
    border: 0;
    border-radius: 13px;
    color: #fff;
    background: linear-gradient(
        90deg,
        #8c5cf4,
        #d45fae
    );
    box-shadow: 0 13px 32px rgba(151,82,223,.28);
    font-size: 16px;
    font-weight: 750;
    cursor: pointer;
}

button:hover {
    filter: brightness(1.06);
}

.privacy {
    margin: 22px 0 0;
    color: #827994;
    text-align: center;
    font-size: 12px;
}

@media (max-width: 520px) {
    .login-card {
        padding: 31px 24px 28px;
        border-radius: 22px;
    }
}
</style>
</head>

<body>

<main class="login-card">
    <div class="brand">
        <div class="brand-mark">A</div>
        <div>
            <div class="brand-name">Portal Admin</div>
            <div class="brand-note">Private operations console</div>
        </div>
    </div>

    <h1>Welcome back</h1>
    <p class="subtitle">
        Sign in to view system health and staff activity.
    </p>

    {% if error %}
    <div class="error" role="alert">
        {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/admin/login">
        <label for="username">Username</label>
        <input
            id="username"
            type="text"
            name="username"
            autocomplete="username"
            required
            autofocus
        >

        <label for="password">Password</label>
        <input
            id="password"
            type="password"
            name="password"
            autocomplete="current-password"
            required
        >

        <button type="submit">Sign In</button>
    </form>

    <p class="privacy">Administrator access only</p>
</main>

</body>
</html>
