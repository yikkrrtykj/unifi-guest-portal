<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>WiFi Connected</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system,
                 BlinkMacSystemFont,
                 "Segoe UI",
                 Arial,
                 sans-serif;
    background: #f3f5f9;
    color: #202124;
}

.card {
    max-width: 400px;
    margin: 80px auto;
    background: #ffffff;
    padding: 42px 25px;
    border-radius: 18px;
    text-align: center;
    box-shadow:
        0 10px 35px rgba(0,0,0,.08);
}

.ok {
    font-size: 62px;
    margin-bottom: 10px;
}

h1 {
    margin-bottom: 10px;
}

p {
    color: #666;
    line-height: 1.6;
}
</style>

</head>

<body>

<div class="card">

    <div class="ok">✓</div>

    <h1>WiFi Connected</h1>

    {% if returning %}

    <p>
        Welcome back, {{ name }}.
    </p>

    {% else %}

    <p>
        Thank you, {{ name }}.
    </p>

    {% endif %}

    <p>
        Your device now has Internet access.
    </p>

    <p>
        You may close this window.
    </p>

</div>

{% if redirect_url %}

<script>
setTimeout(function () {
    window.location.replace(
        {{ redirect_url|tojson }}
    );
}, 1500);
</script>

{% endif %}

</body>

</html>
